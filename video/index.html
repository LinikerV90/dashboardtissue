
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard Tissue - Administração</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(145deg,#f0f5fb,#fff);
      font-family: Inter,Arial,sans-serif;
    }
    header {
      background: white;
      padding: 10px 20px;
      box-shadow: 0 2px 6px #0002;
    }
    header img { height: 50px; }
    main {
      width: 100%;
      min-height: calc(100vh - 80px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    iframe {
      width: 100%;
      max-width: 540px;
      height: 560px;
      border: 0;
    }
  </style>
</head>
<body>
  <header>
    <img src="../suzano-logo-branco.png" alt="Suzano">
  </header>

  <main>
    <iframe
      src="https://script.google.com/macros/s/AKfycbwngmk5k_ea17gZv_e9ReDAYYazkSHK77x8viShJT5OBqqyJFe_LYoOqNmv7STuOhzCeA/exec"
      title="Administração de vídeos"
      allow="fullscreen">
    </iframe>
  </main>
</body>
</html>
