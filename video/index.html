
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administração de Vídeo | Dashboard Tissue</title>
<style>
:root {
  --azul: #0051A2;
  --azul-claro: #00B2E2;
  --fundo: #f0f5fb;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(145deg,var(--fundo),#fff);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  color: #333;
}
header, footer {
  background: white;
  padding: 16px 24px;
  box-shadow: 0 2px 6px #0001;
}
header img { height: 45px; }
main {
  flex: 1;
  display: grid;
  place-items: center;
  padding: 25px;
}
.card {
  background: white;
  width: 100%;
  max-width: 480px;
  padding: 35px;
  border-radius: 16px;
  box-shadow: 0 10px 30px #0002;
  text-align: center;
}
h1 { color: var(--azul); margin-bottom: 12px; }
p { color: #666; margin-bottom: 24px; line-height: 1.5; }
input[type=password] {
  width: 100%;
  padding: 14px;
  border: 1px solid #ccc;
  border-radius: 8px;
  margin-bottom: 15px;
  font-size: 16px;
}
.file-area {
  border: 2px dashed #9bbbd8;
  padding: 25px 15px;
  border-radius: 10px;
  margin-bottom: 18px;
  background: #f8fbff;
}
input[type=file] { max-width: 100%; }
button {
  width: 100%;
  background: var(--azul);
  color: white;
  padding: 14px;
  border: 0;
  border-radius: 8px;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}
button:hover { background: var(--azul-claro); }
button:disabled { opacity: .6; cursor: wait; }
#uploadArea { display: none; }
#status {
  margin-top: 18px;
  font-size: 14px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}
progress { width: 100%; margin-top: 15px; display: none; }
footer { text-align: center; font-size: 13px; color: #666; }
</style>
</head>
<body>

<header>
  <img src="../suzano-logo-branco.png" alt="Suzano">
</header>

<main>
  <section class="card">
    <div id="loginArea">
      <h1>Área Administrativa</h1>
      <p>Digite a senha para acessar o gerenciamento de vídeos.</p>
      <input id="password" type="password"
        placeholder="Digite sua senha" autocomplete="current-password">
      <button id="loginBtn" onclick="login()">ACESSAR</button>
    </div>

    <div id="uploadArea">
      <h1>Upload de Vídeo</h1>
      <p>Selecione um vídeo MP4 de até 25 MB.</p>

      <div class="file-area">
        <input type="file" id="videoFile" accept=".mp4,video/mp4">
      </div>

      <button id="uploadBtn" onclick="uploadVideo()">
        ENVIAR VÍDEO
      </button>

      <progress id="progress" max="100" value="0"></progress>
    </div>

    <div id="status" role="status" aria-live="polite"></div>
  </section>
</main>

<footer>
  Dashboard Tissue – Administração de Vídeos
</footer>

<script>
const API = "https://SEU-WORKER.workers.dev";

let sessionToken = null;

function status(message, color = "#333") {
  const el = document.getElementById("status");
  el.textContent = message;
  el.style.color = color;
}

async function login() {
  const password = document.getElementById("password").value;
  const button = document.getElementById("loginBtn");

  if (!password) {
    status("Digite a senha.", "red");
    return;
  }

  button.disabled = true;
  status("Verificando acesso...");

  try {
    const response = await fetch(API + "/auth", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password })
    });

    const data = await response.json();

    if (!response.ok) throw new Error(data.error || "Acesso negado.");

    sessionToken = data.token;

    document.getElementById("loginArea").style.display = "none";
    document.getElementById("uploadArea").style.display = "block";
    status("Acesso autorizado.", "green");

  } catch (error) {
    status(error.message, "red");
  } finally {
    button.disabled = false;
  }
}

async function uploadVideo() {
  const file = document.getElementById("videoFile").files[0];
  const button = document.getElementById("uploadBtn");
  const progress = document.getElementById("progress");

  if (!file) {
    status("Selecione um vídeo primeiro.", "red");
    return;
  }

  if (!file.name.toLowerCase().endsWith(".mp4") ||
      file.type !== "video/mp4") {
    status("Selecione um arquivo MP4 válido.", "red");
    return;
  }

  if (file.size > 25 * 1024 * 1024) {
    status("O vídeo ultrapassa o limite de 25 MB.", "red");
    return;
  }

  button.disabled = true;
  progress.style.display = "block";
  progress.value = 0;
  status("Enviando vídeo ao GitHub...");

  try {
    // Upload por fetch não fornece progresso real de envio.
    progress.removeAttribute("value");

    const response = await fetch(API + "/upload", {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + sessionToken,
        "Content-Type": "video/mp4",
        "X-File-Name": encodeURIComponent(file.name)
      },
      body: file
    });

    const data = await response.json();

    if (!response.ok) throw new Error(data.error || "Falha no upload.");

    progress.value = 100;
    progress.setAttribute("value", "100");

    status(
      "Vídeo enviado com sucesso! URL: " + data.url,
      "green"
    );

  } catch (error) {
    status(error.message, "red");
  } finally {
    button.disabled = false;
  }
}

document.getElementById("password").addEventListener("keydown", e => {
  if (e.key === "Enter") login();
});
</script>

</body>
</html>
